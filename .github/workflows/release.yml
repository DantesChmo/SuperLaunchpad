name: Release

# Signing and notarization are optional: when the MACOS_* / APPLE_* /
# APPSTORE_* secrets are configured the DMG is signed with Developer ID,
# notarized and stapled; otherwise an unsigned DMG is built as before.
# See docs/RELEASING.md for how to create the secrets.
#
# Sparkle auto-updates are optional too: with the SPARKLE_PUBLIC_ED_KEY
# repository variable and the SPARKLE_ED_PRIVATE_KEY secret the app gets the
# public key and the release gets an EdDSA-signed appcast.xml; without them the
# app's updater stays off.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Check signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          MISSING=""
          for NAME in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD \
                      APPLE_TEAM_ID APPSTORE_API_KEY_P8_BASE64 APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID; do
            if [ -z "${!NAME}" ]; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found: building a signed and notarized DMG"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned build::Missing secrets:$MISSING. Building an UNSIGNED DMG (Gatekeeper will block it). See docs/RELEASING.md."
          fi

      - name: Check Sparkle keys
        id: sparkle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_PUBLIC_ED_KEY" ] && [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Sparkle keys found: the app checks for updates and the release gets appcast.xml"
          elif [ -z "$SPARKLE_PUBLIC_ED_KEY" ] && [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No auto-updates::SPARKLE_PUBLIC_ED_KEY variable and SPARKLE_ED_PRIVATE_KEY secret are not set. The app's updater stays off and no appcast is published. See docs/RELEASING.md."
          else
            # One without the other would ship an app that rejects every update.
            echo "::error::Set both the SPARKLE_PUBLIC_ED_KEY variable and the SPARKLE_ED_PRIVATE_KEY secret, or neither." >&2
            exit 1
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$CERT_PATH"' EXIT
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # Prepend the temporary keychain to the search list so xcodebuild finds the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"; then
            echo "::error::No 'Developer ID Application' identity in MACOS_CERTIFICATE_P12_BASE64" >&2
            exit 1
          fi

      - name: Build (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project SuperLaunchpad.xcodeproj \
            -scheme SuperLaunchpad \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          # Hardened runtime comes from the project (ENABLE_HARDENED_RUNTIME = YES).
          xcodebuild \
            -project SuperLaunchpad.xcodeproj \
            -scheme SuperLaunchpad \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN_PATH" \
            build

      - name: Locate .app
        id: app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release -maxdepth 2 -name 'SuperLaunchpad.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "SuperLaunchpad.app not found" >&2
            exit 1
          fi
          echo "Found app at $APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify app signature
        if: steps.signing.outputs.enabled == 'true'
        env:
          APP_PATH: ${{ steps.app.outputs.path }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=2 "$APP_PATH" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime Version|flags)='

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_PATH: ${{ steps.app.outputs.path }}
        run: |
          set -euo pipefail
          STAGING=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          DMG_NAME="SuperLaunchpad-$VERSION.dmg"
          hdiutil create \
            -volname "SuperLaunchpad" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_NAME"
          echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"

      # The DMG (not the bare .app) is what gets notarized: notarytool inspects the
      # signed app inside it, and the ticket is stapled to the DMG, so one
      # submission covers both. The .app itself is not stapled; Gatekeeper finds
      # its ticket online when the copied app is first launched.
      - name: Sign DMG
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          codesign --force --timestamp --keychain "$KEYCHAIN_PATH" \
            --sign "Developer ID Application" "$DMG_PATH"

      - name: Notarize and staple DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$APPSTORE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

          RESULT=$(xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPSTORE_API_KEY_ID" \
            --issuer "$APPSTORE_API_ISSUER_ID" \
            --wait \
            --output-format json)
          SUBMISSION_ID=$(printf '%s' "$RESULT" | plutil -extract id raw -o - -)
          STATUS=$(printf '%s' "$RESULT" | plutil -extract status raw -o - -)
          echo "Notarization $SUBMISSION_ID finished with status: $STATUS"

          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$APPSTORE_API_KEY_ID" \
              --issuer "$APPSTORE_API_ISSUER_ID" || true
            echo "::error::Notarization failed with status $STATUS" >&2
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"

      - name: Verify DMG
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          xcrun stapler validate "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          spctl -a -vv -t install "$DMG_PATH"

      # $DMG_PATH is final from here on (signed, notarized and stapled
      # when secrets are set).

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "$DMG_PATH" release-assets/

      # The feed URL is releases/latest/download/appcast.xml, so each release
      # carries an appcast with just its own version; older items are not needed.
      - name: Generate appcast
        if: steps.sparkle.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The Sparkle SPM binary artifact ships the command-line tools.
          GENERATE_APPCAST=$(find build/SourcePackages/artifacts -path '*/bin/generate_appcast' -type f | head -n 1)
          if [ -z "$GENERATE_APPCAST" ]; then
            echo "::error::generate_appcast not found in build/SourcePackages/artifacts" >&2
            exit 1
          fi

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION/" \
            --link "https://github.com/${{ github.repository }}" \
            --full-release-notes-url "https://github.com/${{ github.repository }}/releases/tag/v$VERSION" \
            --maximum-deltas 0 \
            release-assets

          test -f release-assets/appcast.xml
          cat release-assets/appcast.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperLaunchpad-${{ steps.version.outputs.version }}-dmg
          path: release-assets/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Clean up signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
